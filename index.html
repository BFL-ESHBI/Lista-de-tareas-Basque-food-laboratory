<script>
(function(){
  var CHECKLIST_ID = document.getElementById("bfl-checklist-id").textContent || "003";
  var STORAGE_KEY = "BFL_Checklist_RM5502K_v1_" + CHECKLIST_ID;
  var DIAS_DEFECTO = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
  var state = {
    titulo:"Lista de tareas",
    tituloSemanal:"Lista de tareas semanal",
    dias: DIAS_DEFECTO.map(function(nombre){ return { id:uid(), nombre:nombre, tareas:[] }; })
  };
  var dirty = false;
  var $ = function(s){ return document.querySelector(s); };
  function uid(){ return Math.random().toString(36).slice(2,9); }

  // ---------- Día abierto en la hoja diaria ----------
  // Se fija al pulsar sobre la columna de un día en la hoja semanal.
  var diaDetalleActual = null;

  // El navegador embebido de la pizarra (EZWrite / Android 8.0) no siempre
  // dispara "click" de forma fiable. Se usa touchend como evento principal
  // y se bloquea el click sintético posterior para evitar doble ejecución.
  function addTap(el, handler){
    var touched = false;
    el.addEventListener("touchend", function(e){
      touched = true;
      e.preventDefault();
      handler(e);
      setTimeout(function(){ touched = false; }, 500);
    }, { passive:false });
    el.addEventListener("click", function(e){
      if(touched){ touched = false; return; }
      handler(e);
    });
  }

  function markDirty(){ dirty = true; }

  function toast(msg){
    var t=$("#toast");
    t.textContent=msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); },2200);
  }

  function escapeHtml(value){
    return String(value || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ---------- Iconos automáticos por palabra clave ----------
  // Detecta "Reunión", "Visita" o "Salida" (sin distinguir mayúsculas/acentos)
  // como palabra completa dentro del texto de la tarea.
  var SVG_REUNION = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"/><circle cx="9" cy="8" r="3"/><path d="M19 19v-1.2a3 3 0 0 0-2-2.8"/><path d="M14.5 5.3a3 3 0 0 1 0 5.8"/></svg>';
  var SVG_VISITA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>';
  var SVG_SALIDA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/></svg>';
  var SVG_ENVIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-7 18-3-7-8-4z"/></svg>';
  var SVG_RELOJ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
  // Cada entrada acepta variantes y sinónimos habituales de la palabra base
  // (singular/plural, verbo, género) para no depender de la forma exacta.
  var PALABRAS_CLAVE_ICONO = [
    { patron: /\breunion(es)?\b|\breun(ir|imos|irse)\b/, type: "reunion", icon: SVG_REUNION, label: "Reunión" },
    { patron: /\bvisitas?\b|\bvisitar(nos)?\b|\bvisitando\b/, type: "visita",  icon: SVG_VISITA,  label: "Visita" },
    { patron: /\bsalidas?\b|\bsalir\b|\bsaliendo\b/, type: "salida",  icon: SVG_SALIDA,  label: "Salida" },
    { patron: /\benv(i|í)[oa]s?\b|\benviar(nos|lo|la)?\b|\benviando\b|\bremesa\b|\bexpedicion(es)?\b/, type: "envio", icon: SVG_ENVIO, label: "Envío" }
  ];
  function detectarIconoTarea(texto){
    var norm = String(texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    for(var i=0;i<PALABRAS_CLAVE_ICONO.length;i++){
      if(PALABRAS_CLAVE_ICONO[i].patron.test(norm)){ return PALABRAS_CLAVE_ICONO[i]; }
    }
    return null;
  }

  // ---------- Paneles ----------
  function mostrarPanel(nombre){
    cerrarPicker();
    document.querySelectorAll(".tab-panel").forEach(function(panel){
      panel.classList.remove("active");
    });
    $("#panel-" + nombre).classList.add("active");
    // Reloj y cuenta atrás visibles también en la hoja diaria
    var bloqueHora = $(".bfl-time-wrap");
    var destinoHora = nombre === "diario" ? $("#diario-hora-slot") : $("#panel-semanal .week-title-row");

        c.classList.toggle("sel", esH ? val===h : val===m);

    function aplicar(){
      task.hora = (h===null || m===null) ? "" : p2h(h)+":"+p2h(m);

    var chips = el.querySelectorAll(".tp-chip");
    for(var cj=0; cj<chips.length; cj++){
      (function(c){
        addTap(c, function(){
          if(c.hasAttribute("data-h")){
            h = parseInt(c.getAttribute("data-h"),10);
            if(m === null){ m = 0; }

            m = parseInt(c.getAttribute("data-m"),10);

  // ---------- Reloj y cuenta atrás ----------
  var MESES_RELOJ=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var DIAS_RELOJ=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  function p2(n){ return n<10?"0"+n:""+n; }

  // ---------- Número de día junto al nombre (sincronizado con la fecha del reloj) ----------
  // Lunes a viernes de la semana en curso; en sábado y domingo se muestra la semana siguiente.
  // Cada semana se guarda por separado (state.semanas), identificada por la fecha de su lunes.
  // claveVista = lunes de la semana que se está viendo.
  function claveDe(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
  function dateDeClave(c){ var q=c.split("-"); return new Date(parseInt(q[0],10), parseInt(q[1],10)-1, parseInt(q[2],10)); }
  function lunesBase(hoy){
    var dow=hoy.getDay();
    var haciaLunes = dow===0 ? 1 : (dow===6 ? 2 : 1-dow);
    return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()+haciaLunes);
  }
  function fechaDeDia(clave, indice){
    var d=dateDeClave(clave);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()+indice);
  }
  function lunesRelativo(clave, semanas){ return claveDe(fechaDeDia(clave, 7*semanas)); }
  var claveVista = claveDe(lunesBase(new Date()));
  function fechaDiaSemana(indice){ return fechaDeDia(claveVista, indice); }

  function nuevaSemana(plantilla){
    var nombres = (plantilla && plantilla.length) ? plantilla.map(function(d){ return d.nombre; }) : DIAS_DEFECTO;
    return nombres.map(function(nombre){ return { id:uid(), nombre:nombre, tareas:[] }; });
  }
  function prepararSemanas(){
    claveVista = claveDe(lunesBase(new Date()));
    if(!state.semanas || typeof state.semanas !== "object"){
      // Datos antiguos (una sola semana): pasan a ser la semana en curso
      state.semanas = {};
      state.semanas[claveVista] = state.dias;
    } else if(!state.semanas[claveVista]){
      state.semanas[claveVista] = nuevaSemana(state.dias);
    }
    state.dias = state.semanas[claveVista];
  }
  function irASemana(clave){
    if(!state.semanas){ state.semanas = {}; }
    if(!state.semanas[clave]){ state.semanas[clave] = nuevaSemana(state.dias); }
    claveVista = clave;
    state.dias = state.semanas[clave];

    actualizarCuentaAtras();

    var ant=fechaDeDia(lunesRelativo(claveVista,-1),0), sig=fechaDeDia(lunesRelativo(claveVista,1),0);
    var tAnt=$("#sem-edge-izq .sem-tab"), tSig=$("#sem-edge-der .sem-tab");
    if(tAnt){ tAnt.innerHTML='<span class="sem-arrow">‹</span><span class="sem-txt"><small>Semana anterior</small><b>Lun '+fmtCorta(ant)+'</b></span>'; }
    if(tSig){ tSig.innerHTML='<span class="sem-arrow">›</span><span class="sem-txt"><small>Semana siguiente</small><b>Lun '+fmtCorta(sig)+'</b></span>'; }
  }

  // Zonas laterales: al acercar el ratón aparece la fecha del lunes de la otra semana.
  // En pantalla táctil: un toque en el borde muestra la etiqueta y un segundo toque cambia de semana.
  function crearZonaLateral(dir){
    var z=document.createElement("div");
    z.id = dir<0 ? "sem-edge-izq" : "sem-edge-der";
    z.className = "sem-edge " + (dir<0 ? "izq" : "der");
    z.innerHTML = '<div class="sem-tab"></div>';
    var tocado=false, tmr=null;
    function ocultar(){ z.classList.remove("show"); }
    function ir(){ ocultar(); irASemana(lunesRelativo(claveVista, dir)); }
    z.addEventListener("touchend", function(e){
      tocado=true; e.preventDefault();
      if(!z.classList.contains("show")){
        z.classList.add("show");
        clearTimeout(tmr); tmr=setTimeout(ocultar, 3500);
      } else { clearTimeout(tmr); ir(); }
      setTimeout(function(){ tocado=false; }, 500);
    }, { passive:false });
    z.addEventListener("click", function(){
      if(tocado){ tocado=false; return; }
      ir();
    });
    $("#panel-semanal").appendChild(z);
  }
  crearZonaLateral(-1);
  crearZonaLateral(1);
  addTap($("#sem-hoy"), function(){ irASemana(claveDe(lunesBase(new Date()))); });
  function numeroDiaSemana(indice){

  function actualizarNumeroDiario(){
    var el=$("#meta-dia-num"), inp=$("#meta-dia-nombre");
    if(!el||!inp) return;
    var idx = diaDetalleActual ? state.dias.indexOf(diaDetalleActual) : -1;
    el.textContent = idx>=0 ? numeroDiaSemana(idx) : "";
    if(!inp.offsetWidth) return;
    var cs=window.getComputedStyle(inp);
    var cv=actualizarNumeroDiario.cv || (actualizarNumeroDiario.cv=document.createElement("canvas"));
    var ctx=cv.getContext("2d");
    ctx.font=cs.fontStyle+" "+cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
    var padL=parseFloat(cs.paddingLeft)+parseFloat(cs.borderLeftWidth);
    var izq=padL+ctx.measureText(inp.value).width+8;
    var maxIzq=inp.offsetWidth-el.offsetWidth-padL;
    el.style.left=Math.max(padL, Math.min(izq, maxIzq))+"px";
    el.style.top=inp.offsetTop+"px";
    el.style.height=inp.offsetHeight+"px";

  var claveFechaNum="";

  function tickReloj(){
    var elT=$("#bfl-clock-time"), elD=$("#bfl-clock-date");

  // Calcula, entre todas las tareas de todos los días con hora e icono asignados,
  // cuál es la próxima de HOY (solo el día y la hora exactos) y actualiza el bloque de cuenta atrás.
  function actualizarCuentaAtras(){
    var wrap=$("#bfl-countdown"), txt=$("#bfl-countdown-text"), lbl=$("#bfl-countdown-label"), icoEl=$("#bfl-countdown-icon");
    if(!wrap) return;
    var ahora=new Date();
    var mejor=null, mejorDiff=Infinity;
    // Se revisan todas las semanas guardadas: solo cuenta la tarea cuyo día real (lunes + posición) es HOY
    var semanasTodas=[];
    if(state.semanas){ for(var kS in state.semanas){ if(state.semanas.hasOwnProperty(kS)){ semanasTodas.push(kS); } } }
    if(state.dias && semanasTodas.indexOf(claveVista)<0){ semanasTodas.push(claveVista); }
    var pares=[];
    semanasTodas.forEach(function(claveSem){
      var diasSem=(state.semanas && state.semanas[claveSem]) ? state.semanas[claveSem] : state.dias;
      (diasSem||[]).forEach(function(dia, diaIdx){ pares.push({dia:dia, fechaDia:fechaDeDia(claveSem, diaIdx)}); });
    });
    pares.forEach(function(par){
      var dia=par.dia, fechaDia=par.fechaDia;
      // La alerta solo puede saltar el día real que corresponde a esta columna
      if(fechaDia.getFullYear()!==ahora.getFullYear() || fechaDia.getMonth()!==ahora.getMonth() || fechaDia.getDate()!==ahora.getDate()) return;
      dia.tareas.forEach(function(task){
        if(task.hecho || !task.hora) return;
        var icono=detectarIconoTarea(task.titulo);
        if(!icono) return;
        var partes=task.hora.split(":");
        if(partes.length<2) return;
        var objetivo=new Date(fechaDia.getFullYear(),fechaDia.getMonth(),fechaDia.getDate(),parseInt(partes[0],10),parseInt(partes[1],10),0,0);
        var diff=objetivo.getTime()-ahora.getTime();
        // Sin salto a "mañana": si la hora ya pasó, no hay alerta
        if(diff>=-60000 && diff<mejorDiff){ mejorDiff=diff; mejor={task:task, icono:icono, diff:diff}; }
      });
    });
    // Limpia el resaltado anterior antes de aplicar el nuevo (o de no aplicar ninguno)
    var filasMarcadas=document.querySelectorAll(".task-row.bfl-alerta, .day-task-row.bfl-alerta");
    for(var fi=0; fi<filasMarcadas.length; fi++){ filasMarcadas[fi].classList.remove("bfl-alerta"); }

    if(!mejor || mejor.diff>60*60*1000){
      wrap.classList.remove("show","urgent");
      return;
    }
    var totalMin=Math.max(0,Math.round(mejor.diff/60000));
    var hh=Math.floor(totalMin/60), mm=totalMin%60;
    txt.innerHTML="<b>"+p2(hh)+":"+p2(mm)+"</b>";
    lbl.textContent=mejor.icono.label+(mejor.task.titulo ? " · "+mejor.task.titulo : "");
    icoEl.innerHTML=mejor.icono.icon;
    wrap.classList.add("show");
    wrap.classList.toggle("urgent", mejor.diff<=10*60*1000);

    // Resalta, en cualquiera de las dos vistas, la fila de la tarea que originó la cuenta atrás
    var filaObjetivo=document.querySelectorAll('[data-task-id="'+mejor.task.id+'"]');
    for(var gi=0; gi<filaObjetivo.length; gi++){ filaObjetivo[gi].classList.add("bfl-alerta"); }
  }

  tickReloj();
  setInterval(function(){ tickReloj(); actualizarCuentaAtras(); }, 1000);

  loadState();
  actualizarCuentaAtras();
})();
</script>
